apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{ - include "labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  type: ClusterIP
  ports:
    - name: strapi
      protocol: TCP
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
