apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strapi.fullname" . }}
  labels:
    app: strapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: strapi
  template:
    metadata:
      labels:
        app: strapi
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
      annotations:
        backup.velero.io/backup-volumes: strapi-data
    spec:
      containers:
        - name: strapi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ADMIN_JWT_SECRET
              value: "temporary_secret_for_recovery"
            - name: JWT_SECRET
              value: "another_temporary_secret"
            - name: APP_KEYS
              value: "key1,key2,key3,key4"
            - name: API_TOKEN_SALT
              value: "temporary_salt"
          ports:
            - containerPort: 1337
          volumeMounts:
            - name: strapi-data
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: strapi-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "strapi.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
