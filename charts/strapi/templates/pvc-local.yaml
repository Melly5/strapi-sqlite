apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strapi-pvc-local
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  storageClassName: local-storage
  volumeName: strapi-local-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi